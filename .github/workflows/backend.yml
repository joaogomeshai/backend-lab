name: Backend Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EXTRA_TAG: ${{ github.event_name == 'push' && 'latest' || format('pr-{0}', github.event.number) }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EXTRA_TAG }}

  trigger-integration:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Trigger Integration Tests
        run: |
          gh api repos/${{ github.repository_owner }}/e2e-flowts-lab/dispatches \
            -f event_type=integration-tests \
            -f "client_payload[frontend_image]=${{ env.REGISTRY }}/${{ github.repository_owner }}/frontend-lab:latest" \
            -f "client_payload[backend_image]=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -f "client_payload[upstream_repo]=${{ github.repository }}" \
            -f "client_payload[upstream_sha]=${{ github.event.pull_request.head.sha || github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
